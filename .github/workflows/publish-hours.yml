name: Publish Hours

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: publish-hours
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-hours:
    runs-on: ubuntu-latest

    env:
      TOGGL_API_TOKEN: ${{ secrets.TOGGL_API_TOKEN }}
      TOGGL_WORKSPACE_ID: 8402728
      TOGGL_PROJECT_ID: 220893526
      TZ: Asia/Dubai

    steps:
      - name: Check configuration
        run: |
          if [ -z "$TOGGL_API_TOKEN" ]; then
            echo "::error::Missing configuration: secrets.TOGGL_API_TOKEN"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch this month's hours from Toggl
        run: |
          MONTH_START=$(date -d yesterday +%Y-%m-01)
          MONTH_END=$(date -d "$MONTH_START +1 month -1 day" +%Y-%m-%d)

          curl -sS --fail-with-body \
            -u "$TOGGL_API_TOKEN:api_token" \
            -H 'Content-Type: application/json' \
            -d "{\"start_date\":\"$MONTH_START\",\"end_date\":\"$MONTH_END\",\"project_ids\":[$TOGGL_PROJECT_ID]}" \
            "https://api.track.toggl.com/reports/api/v3/workspace/$TOGGL_WORKSPACE_ID/summary/time_entries" \
            -o "$RUNNER_TEMP/summary.json"

          jq -n \
            --slurpfile summary "$RUNNER_TEMP/summary.json" \
            --arg month "$(date -d yesterday +%Y-%m)" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              month: $month,
              hours: ((([$summary[0].groups[]?.sub_groups[]?.seconds] | add // 0) / 36) | round / 100),
              updated_at: $updated_at
            }' > hours.json

          cat hours.json

      - name: Commit to repository
        run: |
          git config user.name codinglukas
          git config user.email lukasimbm@gmail.com
          git add hours.json
          git commit -m "chore: update hours"
          git push

          echo "Published: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/hours.json"
